name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
      # setup-uv stopped publishing floating major tags after v7 — pin the exact release
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv pip install --system -r requirements-test.txt
      - run: pytest -v

      # actionlint only reads .github/workflows, and the caller references the
      # reusable workflow by the path it will have in the customer's repository —
      # so stage both there, in a throwaway repo, and lint them as a pair.
      - name: Lint the example workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          staging="$(mktemp -d)"
          mkdir -p "$staging/.github/workflows"
          cp examples/*.yml "$staging/.github/workflows/"
          git -C "$staging" init -q
          (cd "$staging" && "$(go env GOPATH)/bin/actionlint")
