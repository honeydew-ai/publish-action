# One of these per workspace, in .github/workflows/ of the repository that stores
# your Honeydew metadata.
#
# The "paths:" filter is the whole gate: GitHub runs this workflow only when the
# merged pull request touched the workspace's directory. Nothing needs to detect
# changes at run time, so no token and no API call are involved.
#
# Everything else lives in the reusable workflow, so adding a workspace is this
# file and nothing more.
#
# This example lists all four destinations so you can see every option in one
# place. Trim it: delete the destinations this workspace does not publish to,
# both from "targets" and from the inputs below.
---
name: Publish Honeydew — sales

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['sales/**']

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/honeydew-publish.yml
    with:
      workspace: sales
      domain: sales_exec

      # One job runs per destination listed here. Keep only the ones you use.
      targets: '["powerbi", "sigma", "tableau", "thoughtspot"]'

      # --- Power BI -------------------------------------------------------
      # Publishing again with the same model name updates that model.
      powerbi-model-name: Sales Exec
      powerbi-group-id: 3f2a1b4c-0000-0000-0000-000000000000

      # --- Sigma ----------------------------------------------------------
      sigma-connection-id: abc123
      sigma-folder-id: def456
      # After the first run, take the id from the job summary and set it here,
      # or Sigma creates a new data model on every publish.
      # sigma-existing-data-model-id: ghi789

      # --- Tableau --------------------------------------------------------
      # Either the id of an existing data source, to update it...
      tableau-existing-datasource-id: 7a8b9c00-0000-0000-0000-000000000000
      # ...or a name and a project, to create one. Not both.
      # tableau-datasource-name: Sales Exec
      # tableau-project-id: 1d2e3f00-0000-0000-0000-000000000000
      # By default the data source connects with a Honeydew username and
      # password, entered in Tableau after publishing. Set OAUTH to have each
      # Tableau user sign in to Honeydew with their own credentials instead.
      # tableau-authentication: OAUTH

      # --- ThoughtSpot ----------------------------------------------------
      # Publishing again with the same table name updates that table.
      thoughtspot-connection-name: honeydew
      # thoughtspot-table-name: Sales Exec
    secrets: inherit
